<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Analytics Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
            color: #ccc;
        }

        .dashboard {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
            text-align: center;
        }

        .card h3 {
            margin-top: 0;
            color: #666;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 0;
        }

        .chart-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
            margin-bottom: 30px;
        }

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        @media (max-width: 700px) {

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>Sales Analytics Dashboard</h1>

        <p>Monthly business performance overview</p>

    </header>


    <div class="dashboard">


        <!-- Summary Cards -->

        <div class="cards">

            <div class="card">

                <h3>Total Sales</h3>

                <p id="totalSales">₹0</p>

            </div>


            <div class="card">

                <h3>Total Orders</h3>

                <p id="totalOrders">0</p>

            </div>


            <div class="card">

                <h3>Average Order Value</h3>

                <p id="averageOrder">₹0</p>

            </div>

        </div>


        <!-- Chart -->

        <div class="chart-box">

            <h2>Monthly Sales</h2>

            <canvas id="salesChart"></canvas>

        </div>


        <!-- Product Table -->

        <div class="table-box">

            <h2>Product Sales</h2>

            <table>

                <thead>

                    <tr>
                        <th>Product</th>
                        <th>Units Sold</th>
                        <th>Revenue</th>
                    </tr>

                </thead>

                <tbody id="productTable">

                </tbody>

            </table>

        </div>


    </div>


    <script>

        // Dynamic sales data

        const monthlySales = [
            12000,
            18000,
            15000,
            22000,
            27000,
            31000
        ];


        const months = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June"
        ];


        // Order data

        const orders = 250;


        // Product data

        const products = [

            {
                name: "Laptop",
                units: 35,
                revenue: 210000
            },

            {
                name: "Smartphone",
                units: 60,
                revenue: 180000
            },

            {
                name: "Headphones",
                units: 90,
                revenue: 90000
            },

            {
                name: "Keyboard",
                units: 45,
                revenue: 45000
            }

        ];


        // Calculate total sales

        const totalSales = monthlySales.reduce(
            (sum, value) => sum + value,
            0
        );


        // Calculate average order value

        const averageOrder = totalSales / orders;


        // Display summary

        document.getElementById("totalSales").innerText =
            "₹" + totalSales.toLocaleString();


        document.getElementById("totalOrders").innerText =
            orders;


        document.getElementById("averageOrder").innerText =
            "₹" + Math.round(averageOrder).toLocaleString();


        // Display products

        const table = document.getElementById("productTable");


        products.forEach(product => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${product.name}</td>
                <td>${product.units}</td>
                <td>₹${product.revenue.toLocaleString()}</td>
            `;

            table.appendChild(row);

        });


        // Create chart

        const ctx =
            document.getElementById("salesChart");


        new Chart(ctx, {

            type: "line",

            data: {

                labels: months,

                datasets: [{

                    label: "Sales (₹)",

                    data: monthlySales,

                    borderWidth: 3,

                    fill: false,

                    tension: 0.3

                }]

            },

            options: {

                responsive: true,

                scales: {

                    y: {

                        beginAtZero: true

                    }

                }

            }

        });

    </script>

</body>

</html>
